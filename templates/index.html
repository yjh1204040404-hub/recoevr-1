<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAXIS - Live Recovery Queue</title>
    <style>
        body {
            background-color: #1e1f22;
            color: #dbdee1;
            font-family: 'gg sans', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .embed-wrapper {
            background-color: #2b2d31;
            border-radius: 8px;
            border-left: 4px solid #5865F2;
            padding: 24px;
            width: 500px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            border-bottom: 1px solid #3f4147;
            padding-bottom: 12px;
        }

        .embed-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #23a559;
            border-radius: 50%;
            box-shadow: 0 0 8px #23a559;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-box {
            background-color: #1e1f22;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #3f4147;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: #949ba4;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .highlight-blue { color: #00b0f4; }
        .highlight-green { color: #23a559; }
        .highlight-red { color: #da373c; }

        /* Progress Bar */
        .progress-section {
            background-color: #1e1f22;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid #3f4147;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .progress-container {
            background-color: #313338;
            border-radius: 8px;
            height: 14px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5865F2, #00b0f4);
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.8);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }

        /* Queue List */
        .queue-section {
            font-size: 13px;
            color: #b5bac1;
        }
        
        .queue-item {
            padding: 6px 0;
            border-bottom: 1px solid #3f4147;
        }
        
        .queue-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="embed-wrapper">
        <div class="header">
            <div class="embed-title">
                <div class="pulse-dot" id="status-dot"></div>
                VAXIS Live Sync
            </div>
            <div style="font-size: 13px; color: #949ba4; margin-top: 4px;" id="current-server-info">
                서버 데이터를 수신 중입니다...
            </div>
        </div>

        <div class="info-grid">
            <div class="stat-box">
                <div class="stat-label">진행 상황</div>
                <div class="stat-value"><span class="highlight-green" id="stat-success">0</span> / <span id="stat-target">0</span> 명</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">예상 남은 시간</div>
                <div class="stat-value highlight-blue" id="stat-eta">계산 중...</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span id="progress-text">동기화 대기 중</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="queue-section" id="queue-list">
            <!-- 대기열 리스트가 여기에 렌더링 됩니다. -->
            <div class="queue-item">현재 대기 중인 인원이 없습니다.</div>
        </div>
    </div>

    <script>
        async function fetchLiveStatus() {
            try {
                const response = await fetch('/api/queue');
                const data = await response.json();
                
                const current = data.current;
                const queue = data.waiting_queue;

                // 1. 현재 진행 중인 서버 상태 업데이트
                if (current.active) {
                    document.getElementById('status-dot').style.backgroundColor = '#23a559';
                    document.getElementById('status-dot').style.boxShadow = '0 0 8px #23a559';
                    document.getElementById('current-server-info').innerHTML = `현재 복구 중: <strong style="color:#fff;">${current.server}</strong> (요청: ${current.user})`;
                    
                    const totalDone = current.success + current.fail;
                    const target = current.target;
                    const percent = target > 0 ? Math.floor((totalDone / target) * 100) : 0;
                    
                    document.getElementById('stat-success').innerText = current.success;
                    document.getElementById('stat-target').innerText = target;
                    
                    // 남은 시간 계산 (1명당 API 딜레이 약 1.5초 기준)
                    const leftCount = target - totalDone;
                    const etaSeconds = leftCount * 1.5;
                    if (leftCount > 0) {
                        const m = Math.floor(etaSeconds / 60);
                        const s = Math.floor(etaSeconds % 60);
                        document.getElementById('stat-eta').innerText = m > 0 ? `약 ${m}분 ${s}초` : `약 ${s}초`;
                    } else {
                        document.getElementById('stat-eta').innerText = "마무리 중...";
                    }

                    document.getElementById('progress-bar').style.width = `${percent}%`;
                    document.getElementById('progress-percent').innerText = `${percent}%`;
                    document.getElementById('progress-text').innerText = "데이터베이스 인젝션 중...";
                    
                } else {
                    document.getElementById('status-dot').style.backgroundColor = '#80848e';
                    document.getElementById('status-dot').style.boxShadow = 'none';
                    document.getElementById('current-server-info').innerText = "현재 진행 중인 복구 작업이 없습니다.";
                    
                    document.getElementById('stat-success').innerText = "0";
                    document.getElementById('stat-target').innerText = "0";
                    document.getElementById('stat-eta').innerText = "-";
                    document.getElementById('progress-bar').style.width = `0%`;
                    document.getElementById('progress-percent').innerText = `0%`;
                    document.getElementById('progress-text').innerText = "대기 모드";
                }

                // 2. 대기열 리스트 업데이트
                const queueContainer = document.getElementById('queue-list');
                if (queue.length > 0) {
                    let html = `<div style="font-weight: bold; margin-bottom: 8px; color: #fff;">다음 대기열 (${data.queue_count}개)</div>`;
                    queue.forEach((q, index) => {
                        html += `<div class="queue-item"><span style="color:#00b0f4;">#${index + 1}</span> 서버: ${q.server_id} (요청: ${q.user})</div>`;
                    });
                    queueContainer.innerHTML = html;
                } else {
                    queueContainer.innerHTML = `<div class="queue-item">다음 대기열이 없습니다.</div>`;
                }

            } catch (error) {
                console.error("통신 에러:", error);
            }
        }

        // 1초마다 백엔드에 요청하여 실시간으로 데이터 가져오기
        setInterval(fetchLiveStatus, 1000);
        window.onload = fetchLiveStatus;
    </script>
</body>
</html>
